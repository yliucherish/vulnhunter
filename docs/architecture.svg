<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 545" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"></path>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"></path>
    </marker>
  </defs>

  <!-- ============ 入口 ============ -->
  <g>
    <rect x="390" y="25" width="200" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"></rect>
    <text x="490" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">cli.py</text>
    <text x="490" y="66" text-anchor="middle" font-size="10" fill="#64748b">入口：目标 URL · Cookie · 深度</text>
  </g>
  <line x1="490" y1="79" x2="490" y2="111" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"></line>

  <!-- ============ 调度核心 ============ -->
  <g>
    <rect x="270" y="115" width="440" height="88" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"></rect>
    <text x="490" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">engine.py — 并发调度核心</text>
    <text x="490" y="161" text-anchor="middle" font-size="10.5" fill="#64748b">Semaphore 限流 · 检测器优先级调度（快检先行，不被慢请求饿死）</text>
    <text x="490" y="179" text-anchor="middle" font-size="10.5" fill="#64748b">慢端点标记 → 容量 1 串行通道（防 PHP 会话锁饥饿）</text>
    <text x="490" y="197" text-anchor="middle" font-size="10.5" fill="#64748b">失败分类统计 + 超时重试判别式 + 连接类熔断</text>
  </g>

  <!-- ============ 三列：爬虫 / 检测器 / 报告 ============ -->
  <g>
    <rect x="40" y="235" width="240" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"></rect>
    <text x="160" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">crawler.py</text>
    <text x="160" y="279" text-anchor="middle" font-size="10" fill="#64748b">BFS 爬虫 · 同源限制与去重</text>
    <text x="160" y="297" text-anchor="middle" font-size="10" fill="#64748b">表单 / URL 参数自动识别</text>
    <text x="160" y="315" text-anchor="middle" font-size="10" fill="#64748b">副作用黑名单（URL + 字段名）</text>
    <text x="160" y="333" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">产出 InjectionPoint 列表</text>
  </g>
  <g>
    <rect x="330" y="235" width="320" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"></rect>
    <text x="490" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">detectors/ — 插件化检测器</text>
    <text x="490" y="279" text-anchor="middle" font-size="10" fill="#64748b">sqli.py ｜ 报错 + 布尔 + Union + 时间盲注</text>
    <text x="490" y="297" text-anchor="middle" font-size="10" fill="#64748b">xss.py ｜ 反射型，上下文感知</text>
    <text x="490" y="315" text-anchor="middle" font-size="10" fill="#64748b">cmdi.py ｜ 回显 + 多分隔符变形 + 时间盲注</text>
    <text x="490" y="333" text-anchor="middle" font-size="10" fill="#64748b">ssrf.py ｜ 带外触发（OAST 回调）</text>
  </g>
  <g>
    <rect x="700" y="235" width="240" height="110" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"></rect>
    <text x="820" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6d28d9">report.py</text>
    <text x="820" y="279" text-anchor="middle" font-size="10" fill="#64748b">HTML 可视化报告</text>
    <text x="820" y="297" text-anchor="middle" font-size="10" fill="#64748b">判定依据 + 修复建议逐条给出</text>
    <text x="820" y="315" text-anchor="middle" font-size="10" fill="#64748b">覆盖率 / 慢端点 / 失败分类统计</text>
    <text x="820" y="333" text-anchor="middle" font-size="10" font-weight="600" fill="#7c3aed">可以漏报，不假装扫过</text>
  </g>

  <!-- 调度核心 → 三列 -->
  <path d="M400,203 V219 H160 V231" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"></path>
  <text x="278" y="214" text-anchor="middle" font-size="9.5" fill="#2563eb">启动 BFS</text>
  <line x1="490" y1="203" x2="490" y2="231" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"></line>
  <text x="498" y="222" text-anchor="start" font-size="9.5" fill="#2563eb">注入点分发</text>
  <path d="M580,203 V219 H820 V231" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrP)"></path>
  <text x="700" y="214" text-anchor="middle" font-size="9.5" fill="#7c3aed">扫描结果汇总</text>

  <!-- ============ 共用层 ============ -->
  <g>
    <rect x="40" y="380" width="290" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"></rect>
    <text x="185" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">_timing.py</text>
    <text x="185" y="423" text-anchor="middle" font-size="10" fill="#64748b">时间型盲注公共判别</text>
    <text x="185" y="439" text-anchor="middle" font-size="10" fill="#64748b">双时长差值 + 换序复验</text>
  </g>
  <g>
    <rect x="360" y="380" width="290" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"></rect>
    <text x="505" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">_http.py</text>
    <text x="505" y="423" text-anchor="middle" font-size="10" fill="#64748b">请求发送 + 反射检测</text>
    <text x="505" y="439" text-anchor="middle" font-size="10" fill="#64748b">FetchError 分类 + 慢端点测量</text>
  </g>
  <path d="M470,345 V362 H185 V376" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrP)"></path>
  <path d="M510,345 V362 H505 V376" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrP)"></path>
  <text x="855" y="365" text-anchor="end" font-size="9.5" fill="#7c3aed">detectors 与 crawler 共用</text>

  <!-- ============ 实测数据条 ============ -->
  <g>
    <rect x="40" y="465" width="900" height="62" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"></rect>
    <text x="490" y="489" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">DVWA 三档实测（v0.3.2）：low 8 · medium 7 · high 3 ｜ 检测完成度 100/100 · 100/100 · 82/84 ｜ 误报 0</text>
    <text x="490" y="509" text-anchor="middle" font-size="10" fill="#64748b">设计原则：判定依据必须是"漏洞行为本身的产物"，而不是"被回显的输入"——每处未检出均有源码级归因</text>
  </g>
</svg>
