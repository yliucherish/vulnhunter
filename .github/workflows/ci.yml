name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest tests/ -q

      - name: Smoke test — built-in vulnerable app (5 expected findings)
        run: |
          python tests/vulnerable_app.py &
          APP_PID=$!
          sleep 2
          python -m vulnhunter.cli http://127.0.0.1:8888 --depth 1 --timeout 15 \
            --report /tmp/smoke_report.html | tee /tmp/smoke_scan.log
          kill $APP_PID || true
          grep -q "扫描完成" /tmp/smoke_scan.log
          grep -qE "发现 [3-9] 个漏洞" /tmp/smoke_scan.log
          grep -q "Command Injection" /tmp/smoke_report.html
          test -s /tmp/smoke_report.html
          echo "Smoke OK"
